- name: cryptpad
  hosts: marek246.tailnet-ba52.ts.net
  gather_facts: true
  vars_files:
    - "../inventories/prod/secret_vars/all.yaml"
    - "../inventories/prod/secret_vars/services/cryptpad.yaml"

  pre_tasks:
    - name: Gather per-host secret files
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "../inventories/prod/secret_vars/{{ inventory_hostname }}/base.yaml"
      when: lookup('ansible.builtin.fileglob', item) | length > 0

  tasks:
    
    - name: cryptpad | Import common variables
      ansible.builtin.import_tasks: common-variables.yaml

    - name: cryptpad | cryptpad.container
      ansible.builtin.template:
        src: "../files/cryptpad/cryptpad.container"
        dest: "{{ quadlet_dir }}/cryptpad.container"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: '0640'
      become: "{{ calculated_become }}"
      register: cryptpad_container_output
      notify: Restart service

    - name: cryptpad | config.js
      ansible.builtin.template:
        src: "../files/cryptpad/config.js"
        dest: "{{ cryptpad_dir }}/config.js"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: '0640'
      become: "{{ calculated_become }}"
      register: cryptpad_config_js_output
      notify: Restart service

    - name: cryptpad | application_config.js
      ansible.builtin.template:
        src: "../files/cryptpad/customize/application_config.js"
        dest: "{{ cryptpad_dir }}/customize/application_config.js"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: '0640'
      become: "{{ calculated_become }}"
      register: cryptpad_application_config_js_output
      notify: Restart service

  handlers:
    - name: Restart service
      ansible.builtin.systemd:
        daemon_reload: true
        name: cryptpad.service
        state: restarted
        enabled: true
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
