- name: Bento PDF
  hosts: marek246.tailnet-ba52.ts.net
  gather_facts: true
  vars_files:
    - "../inventories/prod/secret_vars/all.yaml"
    - "../inventories/prod/secret_vars/services/bento-pdf.yaml"

  pre_tasks:
    - name: Gather per-host secret files
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "../inventories/prod/secret_vars/{{ inventory_hostname }}/base.yaml"
      when: lookup('ansible.builtin.fileglob', item) | length > 0

  tasks:
    - name: Bento PDF | Import common variables
      ansible.builtin.import_tasks: common-variables.yaml

    - name: Bento PDF | Systemd Podman Quadlet
      ansible.builtin.template:
        src: "../files/bento-pdf/bento-pdf.container"
        dest: "{{ quadlet_dir }}/bento-pdf.container"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0640"
      become: "{{ calculated_become }}"
      register: systemd_podman_quadlet_output
      notify: Restart service
    
    - name: Bento PDF | Restart service
      ansible.builtin.systemd:
        daemon_reload: true
        name: bento-pdf.service
        state: restarted
        enabled: true
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
      when: >
        systemd_podman_quadlet_output.changed

  handlers:
    - name: Restart service
      ansible.builtin.systemd:
        daemon_reload: true
        name: bento-pdf.service
        state: restarted
        enabled: true
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
