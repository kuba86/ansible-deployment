- name: caddy
  hosts: coreos:dnf
  strategy: free
  gather_facts: true
  vars_files:
    - "../inventories/prod/secret_vars/all.yaml"
    - "../inventories/prod/secret_vars/lets-encrypt.yaml"
  
  pre_tasks:
    - name: Gather per-host secret files
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "../inventories/prod/secret_vars/{{ inventory_hostname }}/base.yaml"
        - "../inventories/prod/secret_vars/{{ inventory_hostname }}/caddy.yaml"
      when: lookup('ansible.builtin.fileglob', item) | length > 0
  
  tasks:

    - name: caddy | Import common variables
      ansible.builtin.import_tasks: common-variables.yaml

    - name: caddy | Systemd Podman Quadlet
      ansible.builtin.template:
        src: "../files/caddy/caddy.container"
        dest: "{{ quadlet_dir }}/caddy.container"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0640"
      become: "{{ calculated_become }}"
      register: systemd_podman_quadlet_output
      
    - name: caddy | ensures directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0750"
      become: "{{ calculated_become }}"
      register: data_dir_output
      loop:
        - "{{ caddy_path }}"
        - "{{ caddy_path }}/etc-caddy"
        - "{{ caddy_path }}/config"
        - "{{ caddy_path }}/data"
        - "{{ caddy_path }}/usr-share-caddy"
        
    - name: caddy | copy Caddyfile(s)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ caddy_path }}/etc-caddy/{{ item | basename }}"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0640"
      with_fileglob:
        - "../inventories/prod/secret_vars/services/caddy/*"
      become: "{{ calculated_become }}"
      register: copy_caddyfile
      
    - name: caddy | Restart service
      ansible.builtin.systemd:
        daemon_reload: true
        name: caddy.service
        state: restarted
        enabled: true
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
      when: >
        systemd_podman_quadlet_output.changed or
        data_dir_output.changed
      
    - name: caddy | validate Caddyfile(s)
      ansible.builtin.shell: |
        set -euo pipefail
        IFS=$'\n\t'

        podman exec caddy caddy validate --config /etc/caddy/Caddyfile
      args:
        executable: /usr/bin/bash
      become: "{{ calculated_become }}"

    - name: caddy | reload caddy server
      ansible.builtin.shell: |
        set -euo pipefail
        IFS=$'\n\t'

        podman exec caddy caddy reload --config /etc/caddy/Caddyfile
      args:
        executable: /usr/bin/bash
      become: "{{ calculated_become }}"
