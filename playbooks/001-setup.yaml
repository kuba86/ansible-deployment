- name: AAAAA
  hosts: coreos:dnf:desktop
  gather_facts: true
  vars_files:
    - "../inventories/prod/secret_vars/all.yaml"

  pre_tasks:
    - name: AAAAA | Gather per-host secret files
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "../inventories/prod/secret_vars/{{ inventory_hostname }}/base.yaml"
      when: lookup('ansible.builtin.fileglob', item) | length > 0

  tasks:
    - name: AAAAA | Import common variables
      ansible.builtin.import_tasks: common-variables.yaml
    
    - name: AAAAA | Systemd Podman Quadlet
      ansible.builtin.template:
        src: "../files/AAAAA/AAAAA.container"
        dest: "{{ quadlet_dir }}/AAAAA.container"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0640"
      become: "{{ calculated_become }}"
      register: systemd_podman_quadlet_output
      notify: Restart service
      
    - name: AAAAA | Systemd Service
      ansible.builtin.template:
        src: "../files/AAAAA/AAAAA.service"
        dest: "{{ service_dir }}/AAAAA.service"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0640"
      become: "{{ calculated_become }}"
      register: systemd_service_output
      notify: Restart service
    
    - name: AAAAA | ensures data directory exists
      ansible.builtin.file:
        path: "/var/mnt/data/AAAAA"
        state: directory
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0750"
      become: "{{ calculated_become }}"
      register: data_dir_output
      notify: Restart service
      
    - name: AAAAA | ensures directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0750"
      become: "{{ calculated_become }}"
      register: data_dir_output
      loop:
        - "{{ some_path }}"
        - "{{ some_path }}/data"
        - "{{ some_path }}/etc"
        - "{{ some_path }}/tls"
      notify: Restart service
    
    - name: AAAAA | Restart service
      ansible.builtin.systemd:
        daemon_reload: true
        name: AAAAA.service
        state: restarted
        enabled: true
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
      when: >
        systemd_podman_quadlet_output.changed or
        data_dir_output.changed

  handlers:
    - name: Restart service
      ansible.builtin.systemd:
        daemon_reload: true
        name: AAAAA.service
        state: restarted
        enabled: true
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
