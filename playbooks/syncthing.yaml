- name: Syncthing
  hosts: coreos:dnf:desktop
  gather_facts: true
  vars_files:
    - "../inventories/prod/secret_vars/all.yaml"

  pre_tasks:
    - name: Gather per-host secret files
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "../inventories/prod/secret_vars/{{ inventory_hostname }}/base.yaml"
        - "../inventories/prod/secret_vars/{{ inventory_hostname }}/syncthing.yaml"
      when: lookup('ansible.builtin.fileglob', item) | length > 0

  tasks:
    - name: Syncthing | Import common variables
      ansible.builtin.import_tasks: common-variables.yaml

    - name: Syncthing | ensures quadlet directory exists
      ansible.builtin.file:
        path: "{{ quadlet_dir }}"
        state: directory
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0750"
      become: true
      register: quadlet_dir_output
    
    - name: Syncthing | Systemd Podman Quadlet
      ansible.builtin.template:
        src: "../files/syncthing/syncthing.container"
        dest: "{{ quadlet_dir }}/syncthing.container"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0600"
      become: "{{ calculated_become }}"
      register: systemd_podman_quadlet_output
    
    - name: Syncthing | ensures data directory exists
      ansible.builtin.file:
        path: "{{ syncthing_data_dir }}"
        state: directory
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0750"
      become: true
      register: data_dir_output
    
    - name: Syncthing | Restart service
      ansible.builtin.systemd:
        daemon_reload: true
        name: syncthing.service
        state: restarted
        enabled: true
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
      when: >
        systemd_podman_quadlet_output.changed or
        data_dir_output.changed
