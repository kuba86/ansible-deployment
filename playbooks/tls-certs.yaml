- name: TLS Certs
  hosts: coreos:dnf
  gather_facts: true
  vars_files:
    - "../inventories/prod/secret_vars/all.yaml"
    - "../inventories/prod/secret_vars/lets-encrypt.yaml"

  pre_tasks:
    - name: Gather per-host secret files
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "../inventories/prod/secret_vars/{{ inventory_hostname }}/base.yaml"
        - "../inventories/prod/secret_vars/{{ inventory_hostname }}/rclone.yaml"
      when: lookup('ansible.builtin.fileglob', item) | length > 0

  tasks:
    - name: TLS Certs | Import common variables
      ansible.builtin.import_tasks: common-variables.yaml

    - name: TLS Certs | ensures data directory exists
      ansible.builtin.file:
        path: "{{ lets_encrypt_dir }}"
        state: directory
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0700"
      become: "{{ calculated_become }}"
      register: data_dir_output
      
    - name: TLS Certs | Podman Quadlet Service
      ansible.builtin.template:
        src: "../files/tls-certs/tls-certs.container"
        dest: "{{ quadlet_dir }}/tls-certs.container"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0640"
      become: "{{ calculated_become }}"
      register: quadlet_service_output
      
    - name: TLS Certs | Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
      when: quadlet_service_output.changed
    
    - name: TLS Certs | Systemd Timer
      ansible.builtin.template:
        src: "../files/tls-certs/tls-certs.timer"
        dest: "{{ service_dir }}/tls-certs.timer"
        comment_start_string: "# BEGIN_OF_COMMENT"
        comment_end_string: "# END_OF_COMMENT"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "0640"
      become: "{{ calculated_become }}"
      register: systemd_timer_output
        
    - name: Enable timer
      ansible.builtin.systemd:
        daemon_reload: true
        name: tls-certs.timer
        state: started
        enabled: true
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
      
    - name: Start service
      ansible.builtin.systemd:
        daemon_reload: true
        name: tls-certs.service
        state: started
        scope: "{{ systemd_scope }}"
      become: "{{ calculated_become }}"
